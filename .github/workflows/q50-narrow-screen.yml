name: Q5_0 narrow Java allocation repair screen
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/q50-narrow-screen.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86, runner: ubuntu-24.04}
          - {arch: arm, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Extract immutable baseline and isolated arithmetic-preserving repair
        env:
          PAYLOAD_URL: ${{ secrets.Q50_NARROW_SCREEN_URL }}
        run: |
          set -euo pipefail
          mkdir -p proof-out
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '7fb7241781d3af3a66938a4998ded5a18a455b71cb13fbcd493271747122d4f1  payload.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          with tarfile.open('payload.tar.gz') as archive:
              archive.extractall('.', filter='data')
          PY
      - name: Verify public numerical and actual model parity then fixed component pairs
        run: python3 payload/run.py run ${{ matrix.arch }}
      - name: Retain every fixed pair and descriptive ratios
        run: python3 payload/analyze.py proof-out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q50-narrow-screen-${{ matrix.arch }}
          path: |
            proof-out
            payload/protocol.json
            payload/files.json
            payload/candidate-manifest.json
          retention-days: 30
