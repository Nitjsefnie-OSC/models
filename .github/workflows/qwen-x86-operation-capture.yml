name: Qwen x86 current-runtime complete operation capture
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/qwen-x86-operation-capture.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Fetch immutable final runtime and diagnostic observer
        env:
          PAYLOAD_URL: ${{ secrets.QWEN_X86_OPERATION_CAPTURE_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '60fd3a6b6b33415b42960027213277d9b58621d1d4250c325f99c65001015d13  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile
          with tarfile.open('payload.tar.gz') as t:t.extractall('.',filter='data')
          PYCODE
          python3 payload/run.py prepare
      - name: Install fixed reference-array dependency
        run: python3 -m pip install 'numpy==2.3.3'
      - name: Check independent x86 projection reference against native ABI
        run: |
          python3 payload/replay-projections/native-preflight.py payload/rust/target/release/libjmodels_kernels.so 8d968c39e4adc710506d5c2f29d5fa0cfeeda0a527a7e020a111f83d49a27833 out/projection-reference-preflight.json
      - name: Original runtime three fresh sessions per frozen request
        run: python3 payload/run.py plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-x86-operation-plain
          compression-level: 1
          path: |
            out/plain/
            out/plain.*
            out/*.json
            out/compile-*
            out/build-*
      - name: Observe all layers and eight continuations with owned snapshots
        run: python3 payload/run.py observer
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-x86-operation-observer
          compression-level: 1
          path: |
            out/observer/
            out/observer.*
      - name: Verify complete capture and exact plain correspondence
        run: python3 payload/run.py verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-x86-operation-manifest
          path: |
            out/*.json
            payload/protocol.json
            payload/PROTOCOL.md
            payload/instrumentation.json
            payload/files.json
            payload/expected-runtime-entries.json
