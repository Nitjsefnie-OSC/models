name: Final composed ARM activation model quality and resources
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/sleef-models-arm-final.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: [qwen-0.8b, qwen-q51, qwen-4b]
        shard: [0]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - name: Extract and verify immutable source and runtime payload
        env:
          PAYLOAD_URL: ${{ secrets.SLEEF_MODELS_ARM_FINAL_URL }}
        run: |
          set -euo pipefail
          mkdir -p proof-out
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '838bac411326d3876ee004994f36bc86762736c0d3df4a02171628d6e3e6aee5  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('payload.tar.gz') as t:t.extractall('.',filter='data')
          p=pathlib.Path('payload')
          for n,h in json.loads((p/'files.json').read_text()).items():assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h,n
          PYCODE
      - name: Verify all actual JAR entries, native source, exports and public arithmetic
        env:
          Q51_MODEL_URL: ${{ secrets.SLEEF_MODELS_Q51_FIXTURE_URL }}
        run: python3 payload/run.py prepare ${{ matrix.model }} ${{ matrix.shard }}
      - name: Actual observed and plain frozen requests before cohort fanout
        run: python3 payload/run.py smoke ${{ matrix.model }} ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sleef-final-${{ matrix.model }}-host-${{ matrix.shard }}-preflight
          path: |
            proof-out/*.json
            proof-out/*.stdout
            proof-out/*.stderr
            proof-out/symbols-*.txt
            proof-out/*-snapshots
            payload/protocol.json
            payload/files.json
            payload/source-manifest.json
            payload/expected-runtime.json
          retention-days: 30
  cohort:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model: [qwen-0.8b, qwen-q51, qwen-4b]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - name: Extract and verify immutable source and runtime payload
        env:
          PAYLOAD_URL: ${{ secrets.SLEEF_MODELS_ARM_FINAL_URL }}
        run: |
          set -euo pipefail
          mkdir -p proof-out
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '838bac411326d3876ee004994f36bc86762736c0d3df4a02171628d6e3e6aee5  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('payload.tar.gz') as t:t.extractall('.',filter='data')
          p=pathlib.Path('payload')
          for n,h in json.loads((p/'files.json').read_text()).items():assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h,n
          PYCODE
      - name: Verify all actual JAR entries, native source, exports and public arithmetic
        env:
          Q51_MODEL_URL: ${{ secrets.SLEEF_MODELS_Q51_FIXTURE_URL }}
        run: python3 payload/run.py prepare ${{ matrix.model }} ${{ matrix.shard }}
      - name: Frozen quality arm 0, observed dispatch and owned vectors
        run: python3 payload/run.py quality-0 ${{ matrix.model }} ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sleef-final-${{ matrix.model }}-host-${{ matrix.shard }}-quality-0
          path: |
            proof-out/*.json
            proof-out/*.stdout
            proof-out/*.stderr
            proof-out/symbols-*.txt
            proof-out/*-snapshots
            payload/protocol.json
            payload/files.json
            payload/source-manifest.json
            payload/expected-runtime.json
          retention-days: 30
      - name: Frozen quality arm 1, observed dispatch and owned vectors
        run: python3 payload/run.py quality-1 ${{ matrix.model }} ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
