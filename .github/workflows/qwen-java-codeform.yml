name: Qwen Java K-kernel exact code-form diagnosis
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/qwen-java-codeform.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, arm]
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 50
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness
          ref: 37582fcf48b9262a260dc3d55051d0dec992f475
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Fetch immutable diagnostic and held runtime
        env:
          PAYLOAD_URL: ${{ secrets.QWEN_PURE_PROJECTION_URL }}
          COMPOSED_URL: ${{ secrets.GDN_COMPOSED_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo "ee0e9f3250a38d127fbdbd1d9d3798d675232d02e1bd5d219e6d5e23e33c21c9  payload.tar.gz" | sha256sum -c -
          tar -xzf payload.tar.gz
          curl --fail --silent --show-error --location "$COMPOSED_URL" -o composed.tar.gz
          python3 - <<'PYCODE'
          import hashlib,json,tarfile
          p=json.load(open('harness/scripts/gdn-sharded/protocol.json'))
          assert hashlib.sha256(open('composed.tar.gz','rb').read()).hexdigest()==p['runtimePayloadSha256']
          with tarfile.open('composed.tar.gz') as t:t.extractall('.',filter='data')
          PYCODE
      - name: Verify actual Linux artifact inventory
        env:
          GDN_REFERENCE_URL: ${{ secrets.GDN_REFERENCE_URL }}
        run: python3 payload/run.py prepare --arch ${{ matrix.arch }}
      - name: Fetch and verify exact code-form control
        env:
          CONTROL_URL: ${{ secrets.QWEN_JAVA_CODEFORM_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$CONTROL_URL" -o control.tar.gz
          echo "a7dd080e4e5879aebcb987807262ccb5376644b9162223784f731655ad249e55  control.tar.gz" | sha256sum -c -
          tar -xzf control.tar.gz
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json
          for name,h in json.load(open('control/manifest.json')).items():
              assert hashlib.sha256(Path('control',name).read_bytes()).hexdigest()==h
          PYCODE
          python3 control/run.py prepare
      - name: Pair 0 published uninstrumented Java process
        run: python3 control/run.py arm --pair 0 --arm published
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-codeform-${{ matrix.arch }}-pair-0-published
          path: |
            out/pair-0-published.*
            out/pair-0-published-snapshots/*
      - name: Pair 0 baseline uninstrumented Java process
        run: python3 control/run.py arm --pair 0 --arm baseline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-codeform-${{ matrix.arch }}-pair-0-baseline
          path: |
            out/pair-0-baseline.*
            out/pair-0-baseline-snapshots/*
      - name: Pair 0 candidate uninstrumented Java process
        run: python3 control/run.py arm --pair 0 --arm candidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-codeform-${{ matrix.arch }}-pair-0-candidate
          path: |
            out/pair-0-candidate.*
            out/pair-0-candidate-snapshots/*
      - name: Pair 1 candidate uninstrumented Java process
        run: python3 control/run.py arm --pair 1 --arm candidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-codeform-${{ matrix.arch }}-pair-1-candidate
          path: |
            out/pair-1-candidate.*
            out/pair-1-candidate-snapshots/*
      - name: Pair 1 baseline uninstrumented Java process
        run: python3 control/run.py arm --pair 1 --arm baseline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-codeform-${{ matrix.arch }}-pair-1-baseline
          path: |
            out/pair-1-baseline.*
            out/pair-1-baseline-snapshots/*
      - name: Pair 1 published uninstrumented Java process
        run: python3 control/run.py arm --pair 1 --arm published
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-codeform-${{ matrix.arch }}-pair-1-published
          path: |
            out/pair-1-published.*
            out/pair-1-published-snapshots/*
      - name: Check owned full-vocabulary correspondence
        run: python3 control/run.py analyze
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-codeform-${{ matrix.arch }}-summary
          path: |
            out/*.json
            out/public-*.stdout
            out/public-*.stderr
            control/manifest.json
            control/source-proof.json
            control/bytecode-correspondence.json
