name: Qwen Java-only allocation attribution
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/qwen-java-allocation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86]
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness
          ref: 37582fcf48b9262a260dc3d55051d0dec992f475
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Fetch immutable diagnostic and held runtime
        env:
          PAYLOAD_URL: ${{ secrets.QWEN_PURE_PROJECTION_URL }}
          COMPOSED_URL: ${{ secrets.GDN_COMPOSED_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo "ee0e9f3250a38d127fbdbd1d9d3798d675232d02e1bd5d219e6d5e23e33c21c9  payload.tar.gz" | sha256sum -c -
          tar -xzf payload.tar.gz
          curl --fail --silent --show-error --location "$COMPOSED_URL" -o composed.tar.gz
          python3 - <<'PYCODE'
          import hashlib,json,tarfile
          p=json.load(open('harness/scripts/gdn-sharded/protocol.json'))
          assert hashlib.sha256(open('composed.tar.gz','rb').read()).hexdigest()==p['runtimePayloadSha256']
          with tarfile.open('composed.tar.gz') as t:t.extractall('.',filter='data')
          PYCODE
      - name: Verify actual Linux artifact inventory
        env:
          GDN_REFERENCE_URL: ${{ secrets.GDN_REFERENCE_URL }}
        run: python3 payload/run.py prepare --arch ${{ matrix.arch }}
      - name: Plain Java control and separately instrumented allocation captures
        run: |
          python3 - <<'PYCODE'
          import importlib.util,json,pathlib,subprocess
          spec=importlib.util.spec_from_file_location('old',pathlib.Path('harness/scripts/gdn-sharded/run.py').resolve())
          old=importlib.util.module_from_spec(spec);spec.loader.exec_module(old)
          out=pathlib.Path('out').resolve();state=json.loads((out/'prepared.json').read_text())
          for name,route,record in [('java-plain','java',False),('java-profile','java',True),('native-profile','native',True)]:
              flags=[]
              if record:
                  flags=['-XX:FlightRecorderOptions=stackdepth=128',f'-XX:StartFlightRecording=filename={out}/{name}.jfr,settings=profile,dumponexit=true']
              command=['java',*flags,'--add-modules','jdk.incubator.vector','--enable-native-access=ALL-UNNAMED','-Xms2g','-Xmx10g','-cp',f'{out}/lib/native/*:{out}/classes','com.integrallis.models.backend.purejava.qwen35.ProjectionRouteProof',state['model'],state['native'],str(pathlib.Path('payload/tasks.json').resolve()),str(pathlib.Path('payload/requests.json').resolve()),route,str(out/(name+'-snapshots'))]
              assert old.execute(command,out/name,600)
              if record:
                  with (out/(name+'-allocations.json')).open('w') as f:
                      subprocess.run(['jfr','print','--json','--events','jdk.ObjectAllocationSample',str(out/(name+'.jfr'))],stdout=f,check=True)
          def signatures(name):
              return [(r['id'],r['repeat'],r['fullLogitSha256']) for r in old.records(out/(name+'.stdout')) if r.get('kind')=='request']
          plain=signatures('java-plain');profile=signatures('java-profile')
          old.save(out/'allocation-diagnostic.json',{'scope':'Allocation attribution only. All instrumented times excluded from qualification. Same-host plain Java control retained; provider singleton assertion verifies no native projections.','plainProfileLogitsExact':plain==profile,'plainRequests':len(plain),'profileRequests':len(profile)})
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-java-allocation-x86
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
            out/*.progress.jsonl
            out/*.jfr
            out/*-snapshots/*
