name: SwiGLU stable F32 four-arm screen
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/swiglu-f32-screen.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Fetch immutable external diagnostic
        env:
          PAYLOAD_URL: ${{ secrets.SWIGLU_F32_SCREEN_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo "cd1824cfa5db6906cc1d22e37d8c67a7382a8f3b91cf1c5c595ca39715162710  payload.tar.gz" | sha256sum -c -
          tar -xzf payload.tar.gz
      - name: Install pinned Rust compiler
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Verify actual artifacts and source correspondence
        run: python3 payload/run.py prepare
      - name: Finite bits and special-value alias parity
        run: python3 payload/run.py parity
      - name: Exhaustive default and bounded software-FMA numerical checks
        run: python3 payload/run.py numeric
      - name: Four fixed four-arm blocks per shape
        run: python3 payload/run.py timing
      - name: Analyze all retained observations
        if: always()
        run: python3 payload/run.py analyze
      - name: Retain raw receipts including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiglu-f32-${{ matrix.runner }}
          path: evidence/
          retention-days: 30
