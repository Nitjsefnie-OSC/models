name: Actual Q51 native SwiGLU caller repair
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/q51-llama-swiglu-route.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, arm]
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 200
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness
          ref: 37582fcf48b9262a260dc3d55051d0dec992f475
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Fetch immutable caller control and held runtime
        env:
          PAYLOAD_URL: ${{ secrets.Q51_LLAMA_ROUTE_URL }}
          COMPOSED_URL: ${{ secrets.GDN_COMPOSED_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo "9ddb303ce0a44b081df99b9c70acf0a4eeccbbb87bc728a826a5624db3637fc3  payload.tar.gz" | sha256sum -c -
          tar -xzf payload.tar.gz
          curl --fail --silent --show-error --location "$COMPOSED_URL" -o composed.tar.gz
          python3 - <<'PYCODE'
          import hashlib,json,tarfile,pathlib
          p=json.load(open('harness/scripts/q51-composed/protocol.json'))
          assert hashlib.sha256(open('composed.tar.gz','rb').read()).hexdigest()==p['runtimePayloadSha256']
          for n,h in json.load(open('payload/files.json')).items():assert hashlib.sha256(pathlib.Path('payload',n).read_bytes()).hexdigest()==h
          with tarfile.open('composed.tar.gz') as t:t.extractall('.',filter='data')
          PYCODE
      - name: Verify final Linux artifact inventory and compile caller probe
        env:
          Q51_SCRATCH_REFERENCE_URL: ${{ secrets.Q51_SCRATCH_REFERENCE_URL }}
          GDN_REFERENCE_URL: ${{ secrets.GDN_REFERENCE_URL }}
        run: python3 payload/run.py prepare --bundle composed --arch ${{ matrix.arch }} --out out
      - name: Full148-case candidate numerical cohort
        run: python3 payload/run.py cohort --arm candidate --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-llama-${{ matrix.arch }}-cohort-candidate
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Full148-case hybrid numerical cohort
        run: python3 payload/run.py cohort --arm hybrid --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-llama-${{ matrix.arch }}-cohort-hybrid
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Full148-case held numerical cohort
        run: python3 payload/run.py cohort --arm held --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-llama-${{ matrix.arch }}-cohort-held
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Full148-case published numerical cohort
        run: python3 payload/run.py cohort --arm published --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-llama-${{ matrix.arch }}-cohort-published
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 0
        run: python3 payload/run.py timing --pair 0 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-llama-${{ matrix.arch }}-quartet-0
