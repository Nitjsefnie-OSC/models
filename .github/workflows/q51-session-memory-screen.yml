name: Q51 session memory repair screen
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/q51-session-memory-screen.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        host: [0, 1]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Verify frozen source and artifact payload
        env:
          PAYLOAD_URL: ${{ secrets.Q51_SESSION_MEMORY_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo 'ffdb08f48cc436bf6944dda79fabe01ef8459d8670f2f1933f17da6642c1c978  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile,json,hashlib
          from pathlib import Path
          with tarfile.open('payload.tar.gz') as t:t.extractall('.',filter='data')
          for n,h in json.loads(Path('payload/inventory.json').read_text()).items():
              assert hashlib.sha256((Path('payload')/n).read_bytes()).hexdigest()==h,n
          PYCODE
      - name: Rebuild identical native sources and exact Q51 fixture
        run: python3 payload/screen.py prepare --out out --host ${{ matrix.host }}
      - name: Actual routing and six owned-vector fixture requests per arm
        run: python3 payload/screen.py fixture --out out --host ${{ matrix.host }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-session-memory-${{ matrix.host }}-prepare
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed triple 0
        run: python3 payload/screen.py timing --out out --host ${{ matrix.host }} --pair 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-session-memory-${{ matrix.host }}-triple-0
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed triple 1
        run: python3 payload/screen.py timing --out out --host ${{ matrix.host }} --pair 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-session-memory-${{ matrix.host }}-triple-1
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed triple 2
        run: python3 payload/screen.py timing --out out --host ${{ matrix.host }} --pair 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-session-memory-${{ matrix.host }}-triple-2
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed triple 3
        run: python3 payload/screen.py timing --out out --host ${{ matrix.host }} --pair 3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-session-memory-host-${{ matrix.host }}
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
  analyze:
    needs: screen
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact analyzer
        env:
          PAYLOAD_URL: ${{ secrets.Q51_SESSION_MEMORY_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo 'ffdb08f48cc436bf6944dda79fabe01ef8459d8670f2f1933f17da6642c1c978  payload.tar.gz' | sha256sum -c -
          python3 -c "import tarfile; tarfile.open('payload.tar.gz').extractall('.',filter='data')"
      - uses: actions/download-artifact@v8
        with:
          pattern: q51-session-memory-host-*
          path: receipts
      - name: Analyze all fixed host strata without dropping failures
        run: |
          mkdir combined
          for h in 0 1; do cp -R "receipts/q51-session-memory-host-$h" "combined/host-$h"; done
          python3 payload/analyze.py combined summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-session-memory-summary
          path: summary.json
