name: Qwen captured continuous state diagnostic
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/qwen-continuous-state-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        case: [easy-tool_selection-05, original-policy-03-1]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '4'
    steps:
      - name: Install fixed reference dependency
        run: python3 -m pip install 'numpy==2.3.3'
      - name: Fetch immutable numerical diagnostic
        env:
          PAYLOAD_URL: ${{ secrets.QWEN_CONTINUOUS_STATE_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '4be4f7db9cf148bab493a40a3fd0ae60f0cc9d7951ee7889ba9b880e7f791c0c  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile
          with tarfile.open('payload.tar.gz') as t: t.extractall('.', filter='data')
          PYCODE
          cc --version > compiler.txt
          lscpu > cpu.txt
      - name: Prove original arithmetic, continuity, and fault detection
        run: |
          set -euo pipefail
          python3 payload/preflight.py > preflight.log 2>&1
      - name: Recover fixed successful capture without model inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 38580973854 --repo integrallis/models -n qwen-x86-operation-manifest -D capture-manifest
          gh run download 38580973854 --repo integrallis/models -n qwen-x86-operation-observer -D capture-observer
      - name: Replay all continuous states and preserve original FP32 exactness
        run: |
          set -euo pipefail
          timeout 2400s python3 payload/replay.py '${{ matrix.case }}' > replay.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-continuous-state-${{ matrix.case }}
          path: |
            continuous-out/
            payload/
            compiler.txt
            cpu.txt
            preflight.log
            replay.log
          if-no-files-found: error
