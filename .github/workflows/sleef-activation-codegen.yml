name: ARM activation caller compiler diagnosis
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/sleef-activation-codegen.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Verify exact previously measured runtime
        env:
          PAYLOAD_URL: ${{ secrets.SLEEF_ACTIVATION_ADAPTER_URL }}
        run: |
          set -euo pipefail
          mkdir -p proof-out
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '75b171d9cb0735a401f5877f74220ac54098bf30c2662656212b3227bcf046b6  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile,hashlib,json,pathlib
          with tarfile.open('payload.tar.gz') as t:t.extractall('.',filter='data')
          p=pathlib.Path('payload')
          for n,h in json.loads((p/'files.json').read_text()).items():assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h,n
          PYCODE
          lscpu > proof-out/host.txt
          java -XX:+PrintFlagsFinal -version >> proof-out/host.txt 2>&1
          javac --add-modules jdk.incubator.vector -cp payload/candidate.jar -d proof-out/classes payload/probe/*.java
      - name: Fixed actual caller compiler capture - timings excluded
        run: |
          python3 - <<'PYCODE'
          import subprocess,pathlib,json,gzip,shutil
          o=pathlib.Path('proof-out');runs=[]
          for op,n in [('swi',3584),('gates',48),('conv',6144)]:
            cmd=['java','--add-modules','jdk.incubator.vector','--enable-native-access=ALL-UNNAMED','-XX:ActiveProcessorCount=4','-Xms2g','-Xmx2g','-Xbatch','-XX:+UnlockDiagnosticVMOptions','-XX:+PrintCompilation','-XX:+PrintInlining','-XX:CompileCommand=print,com.integrallis.vectors.core.PublishedArmActivations::*','-XX:CompileCommand=print,com.integrallis.vectors.core.SleefExp::vector','-XX:CompileCommand=print,com.integrallis.vectors.core.SleefLog::vector','-cp','proof-out/classes:payload/candidate.jar','com.integrallis.vectors.core.AdapterMeasure',op,str(n)]
            with (o/(op+'.stdout')).open('w') as out,(o/(op+'.stderr')).open('w') as err:r=subprocess.run(cmd,stdout=out,stderr=err,timeout=180)
            runs.append({'operation':op,'size':n,'command':cmd,'exitCode':r.returncode,'scope':'Instrumented diagnostics; exclude all reported timing values'});(o/'executions.json').write_text(json.dumps(runs,indent=2))
            with (o/(op+'.stdout')).open('rb')as f,gzip.open(o/(op+'.stdout.gz'),'wb')as g:shutil.copyfileobj(f,g)
            (o/(op+'.stdout')).unlink()
          assert all(x['exitCode']==0 for x in runs)
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sleef-activation-codegen-arm
          path: |
            proof-out/*.gz
            proof-out/*.stderr
            proof-out/*.json
            proof-out/*.txt
            payload/files.json
            payload/freeze-manifest.json
          retention-days: 30
