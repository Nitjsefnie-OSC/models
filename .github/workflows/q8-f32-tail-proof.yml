name: Q8 F32 unreachable-tail component proof
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/q8-f32-tail-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Verify frozen source and actual JAR payload
        env:
          PAYLOAD_URL: ${{ secrets.Q8_F32_TAIL_PROOF_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '1bb768fcfcdf5fb53a3b7bbc7aebf2f5f5b2c65a1a02561b5a7b7facbb72449b  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile
          with tarfile.open('payload.tar.gz') as archive: archive.extractall('.', filter='data')
          PYCODE
      - name: Exact public numerical checks and fixed paired JMH cohort
        run: python3 payload/run.py measure
      - name: Analyze all fixed pairs without replacing failed gates
        if: always()
        run: python3 payload/run.py analyze
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q8-f32-tail-${{ matrix.runner }}
          path: out/
          retention-days: 30
