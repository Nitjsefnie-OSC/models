name: GDN recurrence boundary quality trace
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/gdn-recurrence-divergence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Fetch immutable diagnostic
        env:
          PAYLOAD_URL: ${{ secrets.GDN_RECURRENCE_TRACE_URL }}
        run: |
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo "c9867a7874b3c9832decd5aecb1785d8c7e495dc26cc7cc67b4c5c47ce824189  payload.tar.gz" | sha256sum -c -
          tar -xzf payload.tar.gz
      - name: Verify actual artifacts and build unchanged native arms
        run: python3 payload/run.py prepare
      - name: model-only
        run: python3 payload/run.py model-only
      - name: Retain model-only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-recurrence-${{ matrix.runner }}-model-only
          path: evidence/
          retention-days: 30
      - name: combined
        run: python3 payload/run.py combined
      - name: Retain completed combined observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-recurrence-${{ matrix.runner }}-combined
          path: evidence/
          retention-days: 30
      - name: strict-convolution
        run: python3 payload/run.py strict-convolution
      - name: Retain completed strict-convolution observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-recurrence-${{ matrix.runner }}-strict-convolution
          path: evidence/
          retention-days: 30
      - name: capture
        run: python3 payload/run.py capture
      - name: Retain completed capture observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-recurrence-${{ matrix.runner }}-capture
          path: evidence/
          retention-days: 30
