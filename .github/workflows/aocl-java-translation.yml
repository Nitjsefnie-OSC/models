name: External AMD Java translation proof
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/aocl-java-translation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Verify and extract immutable permissive upstream proof
        env:
          PAYLOAD_URL: ${{ secrets.AOCL_JAVA_TRANSLATION_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo 'd165d38d2ad8bfadd10b26bc5aaa92404a84b05bed8ac09c7326377ab8aefa60  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile
          with tarfile.open('payload.tar.gz') as t:t.extractall('.',filter='data')
          PYCODE
          python3 payload/run.py --verify-only
      - name: Execute fixed upstream assembly and actual warmed JDK comparison
        run: python3 payload/run.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aocl-java-translation
          path: |
            results/
            payload/
          if-no-files-found: error
