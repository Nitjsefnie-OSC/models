name: Q5_0 wide compiler correspondence diagnostic
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/q50-narrow-compiler.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Admit same wide host family before executing frozen diagnostic caller
        env:
          PAYLOAD_URL: ${{ secrets.Q50_NARROW_SCREEN_URL }}
        run: |
          set -euo pipefail
          mkdir -p proof-out
          lscpu > proof-out/diagnostic-host.txt
          grep -q 'AMD EPYC 7763' proof-out/diagnostic-host.txt
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '7fb7241781d3af3a66938a4998ded5a18a455b71cb13fbcd493271747122d4f1  payload.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          with tarfile.open('payload.tar.gz') as archive:
              archive.extractall('.', filter='data')
          PY
      - name: Capture baseline and candidate compilation only
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, json
          path=pathlib.Path('payload/run.py').resolve()
          spec=importlib.util.spec_from_file_location('frozen',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.prepare('x86')
          for arm in ['baseline','candidate']:
              command=module.java(arm,'com.integrallis.vectors.core.Q50ComponentProof',[32])
              command[1:1]=['-Xbatch','-XX:+UnlockDiagnosticVMOptions','-XX:+LogCompilation',
                  '-XX:LogFile='+str(module.O/(arm+'-compilation.xml')),
                  '-XX:CompileCommand=print,com.integrallis.vectors.core.PanamaVectorUtilSupport::*',
                  '-XX:CompileCommand=print,com.integrallis.vectors.core.GgufParallelSupport::forEachRow']
              module.run('compiler-'+arm,command,300)
          (module.O/'diagnostic-scope.json').write_text(json.dumps({
              'scope':'Generated code and inlining diagnostic only; all instrumented timing fields excluded from performance qualification',
              'source':'unchanged frozen payload7fb72417; baselinee249/candidatec665; exact same batch32 public caller',
              'status':'COMPLETE'},indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q50-wide-compiler
          path: |
            proof-out
            payload/protocol.json
            payload/files.json
          retention-days: 30
