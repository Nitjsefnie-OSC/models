name: Composed Bonsai real-weight fixtures
run-name: Composed Bonsai fixtures (b5a302c5 + 9fc500f9)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Bonsai ${{ matrix.platform }} JDK ${{ matrix.java }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        java: ['25.0.3', '25']
        platform: [linux-x86_64, linux-aarch64]
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve exact source bytes and allow long paths
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
      - uses: actions/checkout@v5
        with:
          ref: 218daaea7b3a52e97311b56e5d950245ed917343
          path: models
      - uses: actions/checkout@v5
        with:
          repository: integrallis/vectors
          ref: b0aadc8d972f3504426f6e38fcb0a4b4a97a0333
          path: vectors
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the declared Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.96.0 clippy rustfmt
      - name: Fetch and verify immutable source and validation harness
        env:
          PAYLOAD_URL: ${{ secrets.COMPOSED_NATIVE_VALIDATION_PAYLOAD_URL }}
        run: |
          python - <<'PYCODE'
          import hashlib, os, pathlib, tarfile, urllib.request
          path = pathlib.Path('payload.tar.gz')
          urllib.request.urlretrieve(os.environ['PAYLOAD_URL'], path)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '1b4f818bbc8de4fff3c52411bf971aba7e71e9306cb5bc25a60aa78008f049c1'
          pathlib.Path('harness').mkdir()
          with tarfile.open(path) as archive:
              archive.extractall('harness', filter='data')
          PYCODE
      - name: Verify source and prepare the frozen upstream artifact
        run: python harness/validate-native.py prepare
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache exact Bonsai fixture
        uses: actions/cache@v5
        with:
          path: ~/.jvllm/models/Ternary-Bonsai-2-27B-PTQ1_0.gguf
          key: bonsai2-27b-ptq1_0-fixture-v1
      - name: Run unchanged real-weight assertions against composed sources
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          root = pathlib.Path.cwd()
          contract = root / 'harness/scripts/bonsai-final-qa'
          sys.path.insert(0, str(contract))
          from source_contract import verify_sources
          protocol = json.loads((contract / 'protocol.json').read_text())
          verify_sources(root, protocol)
          core = root / 'vectors/vectors-core/build/libs/vectors-core-0.1.30.jar'
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          assert sha(core) == protocol['coreSha256']
          env = dict(os.environ, BONSAI_UPSTREAM_JAR=str(core), BONSAI_UPSTREAM_REVISION=protocol['vectorsRevision'])
          command = [str(root / 'models/gradlew'), ':backend-native:bonsai2NativeSlowTest', '--init-script', 'scripts/bonsai-upstream-validation.init.gradle', '--no-daemon', '--max-workers=2', '--stacktrace']
          out = root / 'native-validation'
          with (out / 'bonsai-fixtures.log').open('w') as stream:
              process = subprocess.run(command, cwd=root / 'models', env=env, stdout=stream, stderr=subprocess.STDOUT)
          xmls = sorted((root / 'models/backend-native/build/test-results/bonsai2NativeSlowTest').glob('TEST-*.xml'))
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in xmls:
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))
          report = dict(scope='Unchanged CI assertions on unpublished composed source; ordinary released-dependency CI remains separate', command=command, exitCode=process.returncode, suites=len(xmls), totals=totals, coreSha256=sha(core), sourceContracts=protocol['sourceContracts'])
          natives = (root / 'models/backend-native/build/rust-target/release').glob('*.so')
          report['nativeArtifacts'] = {str(p.relative_to(root)): sha(p) for p in natives}
          report['testJava'] = subprocess.check_output(['java', '-version'], stderr=subprocess.STDOUT, text=True)
          (out / 'bonsai-fixture-summary.json').write_text(json.dumps(report, indent=2) + '\n')
          verify_sources(root, protocol)
          assert sha(core) == protocol['coreSha256']
          print(json.dumps(report))
          if process.returncode or totals != dict(tests=3, failures=0, errors=0, skipped=0):
              print((out / 'bonsai-fixtures.log').read_text()[-24000:])
              raise SystemExit(process.returncode or 1)
          PYCODE
      - name: Retain every result and actual native artifact identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: composed-bonsai-${{ matrix.platform }}-jdk-${{ matrix.java }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            native-validation/
            models/backend-native/build/test-results/bonsai2NativeSlowTest/
            models/backend-native/build/reports/bonsai-upstream.json
            models/backend-native/build/reports/tests/bonsai2NativeSlowTest/
            models/backend-native/build/reports/spotbugs/
            models/backend-native/build/libs/
            models/backend-native/build/native-artifacts/
