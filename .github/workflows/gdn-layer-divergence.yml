name: GDN per-layer quality divergence trace
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/gdn-layer-divergence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Fetch immutable diagnostic
        env:
          PAYLOAD_URL: ${{ secrets.GDN_LAYER_TRACE_URL }}
        run: |
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo "71ae57f54f5b3ab8a99553ed77459ce98c5db058b966a049755057336a0a2718  payload.tar.gz" | sha256sum -c -
          tar -xzf payload.tar.gz
      - name: Verify actual artifacts and build unchanged native arms
        run: python3 payload/run.py prepare
      - name: published
        run: python3 payload/run.py published
      - name: Retain published
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-layers-${{ matrix.runner }}-published
          path: evidence/
          retention-days: 30
      - name: combined
        run: python3 payload/run.py combined
      - name: Retain completed combined observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-layers-${{ matrix.runner }}-combined
          path: evidence/
          retention-days: 30
      - name: strict-convolution
        run: python3 payload/run.py strict-convolution
      - name: Retain completed strict-convolution observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-layers-${{ matrix.runner }}-strict-convolution
          path: evidence/
          retention-days: 30
      - name: capture
        run: python3 payload/run.py capture
      - name: Retain completed capture observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-layers-${{ matrix.runner }}-capture
          path: evidence/
          retention-days: 30
