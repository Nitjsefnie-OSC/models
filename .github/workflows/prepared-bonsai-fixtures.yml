name: Prepared final Bonsai real-weight fixtures
run-name: Prepared Bonsai fixtures (f3b32fbb + e249e914)
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/prepared-bonsai-fixtures.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Bonsai ${{ matrix.platform }} JDK ${{ matrix.java }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        java: ['25.0.3', '25']
        platform: [linux-x86_64, linux-aarch64]
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve exact source bytes and allow long paths
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
      - uses: actions/checkout@v5
        with:
          ref: 218daaea7b3a52e97311b56e5d950245ed917343
          path: models
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the declared Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.96.0 clippy rustfmt
      - name: Fetch and verify immutable source and validation harness
        env:
          PAYLOAD_URL: ${{ secrets.PREPARED_NATIVE_VALIDATION_PAYLOAD_URL }}
        run: |
          python - <<'PYCODE'
          import hashlib, os, pathlib, tarfile, urllib.request
          path = pathlib.Path('payload.tar.gz')
          urllib.request.urlretrieve(os.environ['PAYLOAD_URL'], path)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '8c690323d976ae32b054e37b9f08e0e135823235284374cdb01fdeb4a45e6186'
          pathlib.Path('harness').mkdir()
          with tarfile.open(path) as archive:
              archive.extractall('harness', filter='data')
          PYCODE
      - name: Verify source and prepare the frozen upstream artifact
        run: python harness/validate-native.py prepare
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache exact Bonsai fixture
        uses: actions/cache@v5
        with:
          path: ~/.jvllm/models/Ternary-Bonsai-2-27B-PTQ1_0.gguf
          key: bonsai2-27b-ptq1_0-fixture-v1
      - name: Run unchanged real-weight assertions against composed sources
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          root = pathlib.Path.cwd()
          manifest = json.loads((root / 'harness/manifest.json').read_text())
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          def verify():
              for name, digest in manifest['sourceFiles'].items():
                  assert sha(root / 'models' / name) == digest, name
          verify()
          core = root / 'harness/frozen/vectors-core-0.1.30.jar'
          assert sha(core) == manifest['jars'][core.name]['sha256']
          init = root / 'harness/bonsai-fixtures.init.gradle'
          init.write_text("""import org.gradle.api.tasks.testing.Test
          gradle.projectsEvaluated {
            def core = new File(System.getenv('COMPOSED_CORE_JAR'))
            def targets = [':backend-native': 'bonsai2NativeSlowTest', ':backend-java': 'bonsai2IntegrationTest']
            targets.each { projectName, taskName ->
              def p = gradle.rootProject.project(projectName)
              p.tasks.named(taskName, Test).configure {
                def original = classpath
                def old = original.filter { it.name.startsWith('vectors-core-') && it.name.endsWith('.jar') }
                classpath = p.files(core) + (original - old)
                inputs.file(core)
                doFirst { if (old.files.size() != 1) throw new GradleException('Expected exactly one released core'); logger.lifecycle('Frozen core: ' + core + '; effective classpath: ' + classpath.asPath) }
              }
            }
          }
          """)
          env = dict(os.environ, COMPOSED_CORE_JAR=str(core))
          command = [str(root / 'models/gradlew'), ':backend-native:bonsai2NativeSlowTest', ':backend-java:bonsai2IntegrationTest', '--init-script', str(init), '--no-daemon', '--max-workers=2', '--stacktrace']
          out = root / 'native-validation'
          with (out / 'bonsai-fixtures.log').open('w') as stream:
              process = subprocess.run(command, cwd=root / 'models', env=env, stdout=stream, stderr=subprocess.STDOUT)
          xmls = sorted((root / 'models/backend-native/build/test-results/bonsai2NativeSlowTest').glob('TEST-*.xml')) + sorted((root / 'models/backend-java/build/test-results/bonsai2IntegrationTest').glob('TEST-*.xml'))
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in xmls:
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))
          report = dict(scope='Unchanged CI assertions on unpublished composed source; ordinary released-dependency CI remains separate', command=command, exitCode=process.returncode, suites=len(xmls), totals=totals, coreSha256=sha(core), sourceTreeSha256=manifest['sourceTreeSha256'])
          natives = (root / 'models/backend-native/build/rust-target/release').glob('*.so')
          report['nativeArtifacts'] = {str(p.relative_to(root)): sha(p) for p in natives}
          report['testJava'] = subprocess.check_output(['java', '-version'], stderr=subprocess.STDOUT, text=True)
          (out / 'bonsai-fixture-summary.json').write_text(json.dumps(report, indent=2) + '\n')
          verify()
          assert sha(core) == manifest['jars'][core.name]['sha256']
          print(json.dumps(report))
          if process.returncode or totals != dict(tests=4, failures=0, errors=0, skipped=0):
              print((out / 'bonsai-fixtures.log').read_text()[-24000:])
              raise SystemExit(process.returncode or 1)
          PYCODE
      - name: Retain every result and actual native artifact identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prepared-bonsai-${{ matrix.platform }}-jdk-${{ matrix.java }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            native-validation/
            models/backend-native/build/test-results/bonsai2NativeSlowTest/
            models/backend-java/build/test-results/bonsai2IntegrationTest/
            models/backend-native/build/reports/bonsai-upstream.json
            models/backend-native/build/reports/tests/bonsai2NativeSlowTest/
            models/backend-native/build/reports/spotbugs/
            models/backend-native/build/libs/
            models/backend-native/build/native-artifacts/
