name: Native-width x86 compiler correspondence
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: ['.github/workflows/pinned-width-compiler.yml', 'scripts/pinned-width/compiler.py', 'scripts/pinned-width/CompilerEntry.java']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Compile exact public source controls
        run: python3 scripts/pinned-width/run.py prepare "$RUNNER_TEMP/width"
      - name: Capture compiled hot implementations without LogCompilation
        run: python3 scripts/pinned-width/compiler.py "$RUNNER_TEMP/width"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: width-x86-compiler
          path: |
            ${{ runner.temp }}/width/*.json
            ${{ runner.temp }}/width/compiler-*
            ${{ runner.temp }}/width/*/*/*.java
