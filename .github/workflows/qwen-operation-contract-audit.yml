name: Qwen complete-pipeline operation contract audit
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/qwen-operation-contract-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Fetch immutable final runtime and diagnostic observer
        env:
          PAYLOAD_URL: ${{ secrets.QWEN_OPERATION_CONTRACT_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '1f195b9460dda9c9efa696a00e50090f45545faa637b3ee520b619fd2f082641  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile
          with tarfile.open('payload.tar.gz') as t:t.extractall('.',filter='data')
          PYCODE
          python3 payload/run.py prepare
      - name: Original runtime three fresh sessions per frozen request
        run: python3 payload/run.py plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-operation-contract-plain
          compression-level: 1
          path: |
            out/plain/
            out/plain.*
            out/*.json
            out/compile-*
            out/build-*
      - name: Observe all layers and first continuation with owned snapshots
        run: python3 payload/run.py observer
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-operation-contract-observer
          compression-level: 1
          path: |
            out/observer/
            out/observer.*
      - name: Verify complete capture and exact plain correspondence
        run: python3 payload/run.py verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-operation-contract-manifest
          path: |
            out/*.json
            payload/protocol.json
            payload/PROTOCOL.md
            payload/instrumentation.json
            payload/files.json
            payload/expected-runtime-entries.json
