name: Final composed Q51 startup and caller screen
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/q51-final-cleanup-screen.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, arm]
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 200
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Install pinned native compiler
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Fetch immutable external source and runtime payload
        env:
          PAYLOAD_URL: ${{ secrets.Q51_FINAL_CLEANUP_SCREEN_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo 'b48fbf68fac72823cb2ff641e148a9a6b957f8f8b1c711ad61d72ad551f5b719  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile
          with tarfile.open('payload.tar.gz') as archive:
              archive.extractall('.', filter='data')
          PYCODE
      - name: Verify all artifacts and regenerate exact frozen Q51 fixture
        run: python3 payload/run.py prepare --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-prepare
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
            out/PREPARED
      - name: Owned fixture vectors and observed route candidate
        run: python3 payload/run.py fixture --arm candidate --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-fixture-candidate
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Owned fixture vectors and observed route hybrid
        run: python3 payload/run.py fixture --arm hybrid --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-fixture-hybrid
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Owned fixture vectors and observed route held
        run: python3 payload/run.py fixture --arm held --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-fixture-held
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Owned fixture vectors and observed route published
        run: python3 payload/run.py fixture --arm published --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-fixture-published
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 0
        run: python3 payload/run.py timing --pair 0 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-quartet-0
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 1
        run: python3 payload/run.py timing --pair 1 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-quartet-1
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 2
        run: python3 payload/run.py timing --pair 2 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-quartet-2
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 3
        run: python3 payload/run.py timing --pair 3 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-quartet-3
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 4
        run: python3 payload/run.py timing --pair 4 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-quartet-4
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 5
        run: python3 payload/run.py timing --pair 5 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-quartet-5
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 6
        run: python3 payload/run.py timing --pair 6 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-quartet-6
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 7
        run: python3 payload/run.py timing --pair 7 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-quartet-7
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 8
        run: python3 payload/run.py timing --pair 8 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-quartet-8
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 9
        run: python3 payload/run.py timing --pair 9 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-quartet-9
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 10
        run: python3 payload/run.py timing --pair 10 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-quartet-10
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Fixed quartet 11
        run: python3 payload/run.py timing --pair 11 --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-quartet-11
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: Analyze every frozen quartet and startup diagnostic
        if: always()
        run: python3 payload/analyze.py out out/summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-final-${{ matrix.arch }}-complete
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
          retention-days: 30
