name: Native-width pinned dot and Q51 decoder diagnosis
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: ['.github/workflows/pinned-width-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Compile frozen production sources with one compiler
        run: python3 scripts/pinned-width/run.py prepare "$RUNNER_TEMP/width"
      - name: Retain exact source and class provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: width-${{ matrix.runner }}-provenance
          path: ${{ runner.temp }}/width/*.json
      - name: Independent dot and decoder pair 0
        run: |
          python3 scripts/pinned-width/run.py pair "$RUNNER_TEMP/width" dot 0
          python3 scripts/pinned-width/run.py pair "$RUNNER_TEMP/width" decoder 0
      - name: Retain pair 0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: width-${{ matrix.runner }}-pair-0
          path: |
            ${{ runner.temp }}/width/*-0-*.stdout
            ${{ runner.temp }}/width/*-0-*.stderr
            ${{ runner.temp }}/width/*-0-*.execution.json
            ${{ runner.temp }}/width/*-0.complete.json
      - name: Independent dot and decoder pair 1
        run: |
          python3 scripts/pinned-width/run.py pair "$RUNNER_TEMP/width" dot 1
          python3 scripts/pinned-width/run.py pair "$RUNNER_TEMP/width" decoder 1
      - name: Retain pair 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: width-${{ matrix.runner }}-pair-1
          path: |
            ${{ runner.temp }}/width/*-1-*.stdout
            ${{ runner.temp }}/width/*-1-*.stderr
            ${{ runner.temp }}/width/*-1-*.execution.json
            ${{ runner.temp }}/width/*-1.complete.json
      - name: Independent dot and decoder pair 2
        run: |
          python3 scripts/pinned-width/run.py pair "$RUNNER_TEMP/width" dot 2
          python3 scripts/pinned-width/run.py pair "$RUNNER_TEMP/width" decoder 2
      - name: Retain pair 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: width-${{ matrix.runner }}-pair-2
          path: |
            ${{ runner.temp }}/width/*-2-*.stdout
            ${{ runner.temp }}/width/*-2-*.stderr
            ${{ runner.temp }}/width/*-2-*.execution.json
            ${{ runner.temp }}/width/*-2.complete.json
