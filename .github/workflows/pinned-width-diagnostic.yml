            ${{ runner.temp }}/width/*-11-*.execution.json
            ${{ runner.temp }}/width/*-11.complete.json
      - name: Analyze all fixed pairs without pooling kernels
        run: python3 scripts/pinned-width/analyze.py "$RUNNER_TEMP/width" "$RUNNER_TEMP/width/summary.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: width-${{ matrix.runner }}-summary
          path: ${{ runner.temp }}/width/summary.json
