name: Bonsai process residency diagnosis
on:
  workflow_dispatch:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/bonsai-residency-diagnosis.yml]
permissions:
  contents: read
jobs:
  diagnosis:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            runner: ubuntu-24.04-arm
          - arch: x86
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      ARCH: ${{ matrix.arch }}
      PAIR: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Fetch and admit bounded residency diagnostic
        env:
          DIAG_URL: ${{ secrets.BONSAI_RESIDENCY_DIAGNOSTIC_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$DIAG_URL" -o diagnostic.tar.gz
          echo 'd1f6207675158cf555e5d4aa7bc53420a8c73f153d058f41c5cae34152677edb  diagnostic.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile
          with tarfile.open('diagnostic.tar.gz') as t: t.extractall('.', filter='data')
          PYCODE
          python3 diagnostic/run.py admit "$ARCH"
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch immutable external source and harness
        env:
          PAYLOAD_URL: ${{ secrets.BONSAI_PREPARED_RESOURCE_PAYLOAD_URL }}
        run: |
          curl -fL --retry 3 "$PAYLOAD_URL" -o payload.tar.gz
          echo '4d4895a27a708da468d414a7dd291aa942983cc5b494d8f1b9a767e2f15544f7  payload.tar.gz' | sha256sum -c -
          tar -xzf payload.tar.gz
          python3 payload/protocol_check.py payload/protocol.json payload/matrix.json --frozen
      - uses: actions/checkout@v5
        with:
          repository: integrallis/models
          ref: 218daaea7b3a52e97311b56e5d950245ed917343
          path: models-base
      - uses: actions/checkout@v5
        with:
          repository: integrallis/models
          ref: 218daaea7b3a52e97311b56e5d950245ed917343
          path: models-candidate
      - name: Apply frozen candidate source and build exact runtimes
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          python3 payload/apply_source.py models-candidate
          (cd models-base && ./gradlew :backend-native:cargoBuildRelease :backend-native:copyPairedRuntime --init-script ../payload/scripts/bonsai-paired/runtime.init.gradle --no-daemon --max-workers=2)
          (cd models-candidate && ./gradlew :backend-native:cargoBuildRelease :backend-native:copyPairedRuntime :models-runtime:jar --init-script ../payload/scripts/bonsai-paired/runtime.init.gradle --no-daemon --max-workers=2)
          cp models-candidate/models-runtime/build/libs/models-runtime-0.3.59.jar models-candidate/backend-native/build/paired-runtime/
          python3 payload/build_instrumented.py models-candidate instrumented-source
          cargo +1.96.0 build --release --locked --offline --manifest-path instrumented-source/backend-native/src/main/rust/model-kernels/Cargo.toml
          python3 payload/fetch_weights.py "$RUNNER_TEMP/bonsai2.gguf"
      - name: Prepare and verify all actual artifacts
        run: |
          python3 payload/run_screen.py "$ARCH" "$PAIR" prepare --models-base models-base --models-candidate models-candidate --instrumented-library instrumented-source/backend-native/src/main/rust/model-kernels/target/release/libjmodels_kernels.so --weights "$RUNNER_TEMP/bonsai2.gguf"
      - name: plain baseline seven requests
        run: python3 diagnostic/run.py plain baseline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: residency-${{ matrix.arch }}-plain-baseline
          path: residency-evidence/
          retention-days: 30
      - name: plain control seven requests
        run: python3 diagnostic/run.py plain control
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: residency-${{ matrix.arch }}-plain-control
          path: residency-evidence/
          retention-days: 30
      - name: plain candidate seven requests
        run: python3 diagnostic/run.py plain candidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: residency-${{ matrix.arch }}-plain-candidate
          path: residency-evidence/
          retention-days: 30
      - name: observed baseline seven requests
        run: python3 diagnostic/run.py observed baseline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: residency-${{ matrix.arch }}-observed-baseline
          path: residency-evidence/
          retention-days: 30
      - name: observed control seven requests
        run: python3 diagnostic/run.py observed control
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: residency-${{ matrix.arch }}-observed-control
          path: residency-evidence/
          retention-days: 30
      - name: observed candidate seven requests
        run: python3 diagnostic/run.py observed candidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: residency-${{ matrix.arch }}-observed-candidate
          path: residency-evidence/
          retention-days: 30
      - name: Require full plain versus observer correspondence
        run: python3 diagnostic/run.py verify all
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: residency-${{ matrix.arch }}-final
          path: |
            residency-evidence/
            evidence/prepared.json
            evidence/provenance.json
            evidence/jvm-flags.txt
            diagnostic/
          retention-days: 30
