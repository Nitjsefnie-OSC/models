name: Complete148-case Qwen same-weight official reference
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/qwen-same-weight-reference.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch immutable source, adapters and original tensor inventory
        env:
          PAYLOAD_URL: ${{ secrets.QWEN_SAME_WEIGHT_REFERENCE_URL }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '797517a81d4cd3c7e0f91d1eb494e2a4b41a535c16b2d58d940c9e0ce113e92e  payload.tar.gz' | sha256sum -c -
          tar -xzf payload.tar.gz
          python payload/prepare.py 2>&1 | tee evidence/prepare.log
      - name: Fetch complete unchanged148-case diagnostic campaign
        env:
          CAMPAIGN_URL: ${{ secrets.QWEN_SAME_WEIGHT_REFERENCE_FULL_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$CAMPAIGN_URL" -o campaign.tar.gz
          echo 'bd5611f78162d8d7cc889d7d1f1f4065bedd81f3e7b07a4e6b85dc885413320d  campaign.tar.gz' | sha256sum -c -
          tar -xzf campaign.tar.gz
          python - <<'PYCODE'
          import hashlib,json,pathlib
          root=pathlib.Path('campaign')
          for name,expected in json.loads((root/'manifest.json').read_text()).items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,name
          requests=json.loads((root/'requests.json').read_text())
          protocol=json.loads((root/'protocol.json').read_text())
          assert len(requests)==148 and [x['id'] for x in requests]==protocol['requests']
          PYCODE
          cp campaign/protocol.json evidence/full-protocol.json
          cp campaign/manifest.json evidence/full-manifest.json
          cp campaign/requests.json evidence/full-requests.json
          cp campaign/tasks.json evidence/full-tasks.json
          cp campaign/reference.py evidence/full-reference.py
      - name: Install pinned CPU reference dependencies
        run: |
          set -euo pipefail
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 huggingface-hub==1.31.0 tokenizers==0.23.1 safetensors==0.8.0 PyYAML==6.0.3
          python -m pip install ./payload/transformers-812a950d7037ba93bb624b154030e9068afdce4d
          python -m pip freeze > evidence/python-packages.txt
          lscpu > evidence/cpu.txt
          free -b > evidence/memory.txt
      - name: Run all148 frozen requests through the official same-weight graph
        run: |
          set -euo pipefail
          timeout 1800s python -u campaign/reference.py 2>&1 | tee evidence/reference.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-same-weight-reference-full
          path: evidence/
