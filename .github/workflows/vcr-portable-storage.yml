name: VCR portable local storage validation
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/vcr-portable-storage.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Fetch and verify complete portable source archive
        env:
          SOURCE_URL: ${{ secrets.VCR_PORTABLE_SOURCE_URL }}
        shell: python
        run: |
          import hashlib,os,tarfile,urllib.request
          urllib.request.urlretrieve(os.environ['SOURCE_URL'],'source.tar.gz')
          assert hashlib.sha256(open('source.tar.gz','rb').read()).hexdigest()=='ed0b068302fa98d6b5afb82de54b3e63b10d36730189969df0c2bf514dfd24cf'
          with tarfile.open('source.tar.gz') as t:t.extractall('.',filter='data')
      - name: Test storage, default VCR engines and real cassette playback
        run: python payload/run.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vcr-portability-${{ matrix.os }}
          path: |
            payload/results/
            payload/source-manifest.json
            payload/source/**/build/test-results/test/*.xml
