name: Pinned x86 EXP captured-input compatibility
on:
  workflow_dispatch:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/svml-captured-compatibility.yml]
permissions:
  contents: read
  actions: read
jobs:
  numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact frozen source and protocol
        env:
          PAYLOAD_URL: ${{ secrets.SVML_CAPTURED_COMPATIBILITY_URL }}
        run: |
          set -euo pipefail
          mkdir -p proof-out
          curl -fL --retry 3 "$PAYLOAD_URL" -o payload.tar.gz
          echo 'c294f0cefa7c29445bc42f3da8f857cf717709369bf8e002b821e8cf7d1ac2fe  payload.tar.gz' | sha256sum -c -
          tar -xzf payload.tar.gz
          python3 -m pip install numpy==2.2.6
          uname -a > proof-out/host.txt
          lscpu >> proof-out/host.txt
          java -version 2>> proof-out/host.txt
          sha256sum "$JAVA_HOME/lib/libjsvml.so" "$JAVA_HOME/lib/modules" > proof-out/jdk-library-sha256.txt
      - name: Recover fixed existing ARM trace inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38461032618 --repo integrallis/models --name qwen-operation-contract-manifest --dir capture-manifest
          gh run download 38461032618 --repo integrallis/models --name qwen-operation-contract-plain --dir capture-plain
          gh run download 38461032618 --repo integrallis/models --name qwen-operation-contract-observer --dir capture-observer
      - name: Reconstruct and compare all declared ordinary-domain inputs
        run: python3 payload/run.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: svml-captured-compatibility-x86
          path: |
            proof-out/
            payload/PROTOCOL.json
            payload/files.json
          retention-days: 30
          if-no-files-found: error
