name: Permissive IGC x86 Qwen fixed causal quality
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/igc-x86-model-quality.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - name: Verify immutable cleaned candidate and fixed full cohort
        env:
          PAYLOAD_URL: ${{ secrets.IGC_X86_MODEL_URL }}
        run: |
          set -euo pipefail
          mkdir -p out
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '94ba07553f18fcc092bafdcc82a685c7abb3c382d6817b0f7ba760dc40279573  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile,hashlib,json,pathlib
          with tarfile.open('payload.tar.gz') as t:t.extractall('.',filter='data')
          p=pathlib.Path('payload')
          for n,h in json.loads((p/'files.json').read_text()).items():assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h,n
          PYCODE
          javac --add-modules jdk.incubator.vector -cp payload/igc.jar -d out/probe-classes payload/probe/*.java
          cc --version > out/oracle-compiler.stdout
          cc -O2 -fPIC -shared -ffp-contract=off -Wno-unknown-pragmas payload/reference.c -lm -o out/libigc-reference.so
          sha256sum out/libigc-reference.so payload/reference.c > out/oracle-sha256.stdout
          java --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED -Digc.oracle="$PWD/out/libigc-reference.so" -cp out/probe-classes:payload/igc.jar com.integrallis.vectors.core.AdapterProof public scalar > out/public-parity.stdout 2> out/public-parity.stderr
          java --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED -Digc.oracle="$PWD/out/libigc-reference.so" -cp out/probe-classes:payload/igc.jar com.integrallis.vectors.core.IgcSequenceProof > out/sequence-parity.stdout 2> out/sequence-parity.stderr
          java --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED -cp out/probe-classes:payload/igc.jar com.integrallis.vectors.core.ChunkConsistencyProof > out/chunk-parity.stdout 2> out/chunk-parity.stderr
      - name: Build exact native controls and verify actual runtime inventories
        run: python3 payload/run.py prepare ${{ matrix.shard }}
      - name: Fixed arm 0 - observed routes, plain owned logits, state checks
        run: python3 payload/run.py 0 ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: igc-model-x86-${{ matrix.shard }}-checkpoint-0
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
            out/*-state-snapshots
            payload/protocol.json
            payload/files.json
            payload/expected-runtime.json
          retention-days: 30
      - name: Fixed arm 1 - observed routes, plain owned logits, state checks
        run: python3 payload/run.py 1 ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: igc-model-x86-${{ matrix.shard }}-checkpoint-1
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
            out/*-state-snapshots
            payload/protocol.json
            payload/files.json
            payload/expected-runtime.json
          retention-days: 30
      - name: Fixed arm 2 - observed routes, plain owned logits, state checks
        run: python3 payload/run.py 2 ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: igc-model-x86-${{ matrix.shard }}-checkpoint-2
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
            out/*-state-snapshots
            payload/protocol.json
            payload/files.json
            payload/expected-runtime.json
          retention-days: 30
      - name: Fixed arm 3 - observed routes, plain owned logits, state checks
        run: python3 payload/run.py 3 ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: igc-model-x86-${{ matrix.shard }}-checkpoint-3
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
            out/*-state-snapshots
            payload/protocol.json
            payload/files.json
            payload/expected-runtime.json
          retention-days: 30
      - name: Preserve all case outcomes and observer/plain discrepancies
        run: python3 payload/run.py analyze ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: igc-model-x86-${{ matrix.shard }}-final
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
            out/*-state-snapshots
            payload/protocol.json
            payload/files.json
          retention-days: 30
