name: Final composed GDN fixed-shard full-logit and task-quality proof
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: ['.github/workflows/gdn-sharded-correctness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        arch: [x86, arm]
        model: [qwen-0.8b, qwen-4b]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Fetch frozen actual runtime and source
        env:
          COMPOSED_URL: ${{ secrets.GDN_COMPOSED_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$COMPOSED_URL" -o composed.tar.gz
          python3 - <<'PYCODE'
          import json,hashlib,tarfile
          p=json.load(open('harness/scripts/gdn-sharded/protocol.json'))
          assert p['dispatchReady'], 'composition freeze is pending'
          assert hashlib.sha256(open('composed.tar.gz','rb').read()).hexdigest()==p['runtimePayloadSha256']
          with tarfile.open('composed.tar.gz') as archive:archive.extractall('.',filter='data')
          PYCODE
      - name: prepare
        env:
          GDN_REFERENCE_URL: ${{ secrets.GDN_REFERENCE_URL }}
          ARCH: ${{ matrix.arch }}
          MODEL: ${{ matrix.model }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 harness/scripts/gdn-sharded/run.py prepare --arch "$ARCH" --model "$MODEL" --bundle composed --out out --shard "$SHARD"
      - name: Retain prepare observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-sharded-${{ matrix.arch }}-${{ matrix.model }}-${{ matrix.shard }}-prepare
          path: |
            out/*.json
            out/*.jsonl
            out/*.stdout
            out/*.stderr
            out/*-state-snapshots/*.f32
      - name: baseline
        env:
          GDN_REFERENCE_URL: ${{ secrets.GDN_REFERENCE_URL }}
          ARCH: ${{ matrix.arch }}
          MODEL: ${{ matrix.model }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 harness/scripts/gdn-sharded/run.py baseline --arch "$ARCH" --model "$MODEL" --bundle composed --out out --shard "$SHARD"
      - name: Retain baseline observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-sharded-${{ matrix.arch }}-${{ matrix.model }}-${{ matrix.shard }}-baseline
          path: |
            out/*.json
            out/*.jsonl
            out/*.stdout
            out/*.stderr
            out/*-state-snapshots/*.f32
      - name: native
        env:
          GDN_REFERENCE_URL: ${{ secrets.GDN_REFERENCE_URL }}
          ARCH: ${{ matrix.arch }}
          MODEL: ${{ matrix.model }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 harness/scripts/gdn-sharded/run.py native --arch "$ARCH" --model "$MODEL" --bundle composed --out out --shard "$SHARD"
      - name: Retain native observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-sharded-${{ matrix.arch }}-${{ matrix.model }}-${{ matrix.shard }}-native
          path: |
            out/*.json
            out/*.jsonl
            out/*.stdout
            out/*.stderr
            out/*-state-snapshots/*.f32
      - name: published
        env:
          GDN_REFERENCE_URL: ${{ secrets.GDN_REFERENCE_URL }}
          ARCH: ${{ matrix.arch }}
          MODEL: ${{ matrix.model }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 harness/scripts/gdn-sharded/run.py published --arch "$ARCH" --model "$MODEL" --bundle composed --out out --shard "$SHARD"
      - name: Retain published observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-sharded-${{ matrix.arch }}-${{ matrix.model }}-${{ matrix.shard }}-published
          path: |
            out/*.json
            out/*.jsonl
            out/*.stdout
            out/*.stderr
            out/*-state-snapshots/*.f32
      - name: analyze
        env:
          GDN_REFERENCE_URL: ${{ secrets.GDN_REFERENCE_URL }}
          ARCH: ${{ matrix.arch }}
          MODEL: ${{ matrix.model }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 harness/scripts/gdn-sharded/run.py analyze --arch "$ARCH" --model "$MODEL" --bundle composed --out out --shard "$SHARD"
      - name: Retain analyze observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-sharded-${{ matrix.arch }}-${{ matrix.model }}-${{ matrix.shard }}-analyze
          path: |
            out/*.json
            out/*.jsonl
            out/*.stdout
            out/*.stderr
            out/*-state-snapshots/*.f32

  aggregate:
    if: always()
    needs: correctness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: gdn-sharded-*-analyze
          path: results
      - name: Verify complete fixed148-case coverage and unchanged quality gates
        run: python3 scripts/gdn-sharded/aggregate.py results summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gdn-sharded-summary
          path: summary.json
