name: Prospective fixed Qwen full-metric proof

on:
  push:
    branches: [fix/qwen-precision-proof]
    paths:
      - '.github/workflows/qwen-precision-validation.yml'
      - 'scripts/qwen-precision/**'
      - 'scripts/bonsai-paired/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  paired:
    name: ${{ matrix.arch }} Qwen full-metric shard ${{ matrix.shard }}
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {arch: x86, shard: '0'}
          - {arch: x86, shard: '1'}
          - {arch: x86, shard: '2'}
          - {arch: x86, shard: '3'}
          - {arch: arm, shard: '0'}
          - {arch: arm, shard: '1'}
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness
      - name: Read immutable protocol
        id: protocol
        run: |
          python3 - <<'PY'
          import json, os
          p=json.load(open('harness/scripts/qwen-precision/protocol.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('models='+p['modelsRevision']+'\n')
              f.write('vectors='+p['vectorsRevision']+'\n')
          PY
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.protocol.outputs.models }}
          path: models
      - uses: actions/checkout@v5
        with:
          repository: integrallis/vectors
          ref: ${{ steps.protocol.outputs.vectors }}
          path: vectors
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Build immutable actual artifacts
        run: |
          set -euo pipefail
          test "$(git -C models rev-parse HEAD)" = '${{ steps.protocol.outputs.models }}'
          test "$(git -C vectors rev-parse HEAD)" = '${{ steps.protocol.outputs.vectors }}'
          (cd vectors && ./gradlew :vectors-core:jar --no-daemon --max-workers=2)
          (cd models && ./gradlew :backend-native:cargoBuildRelease :backend-native:copyPairedRuntime --init-script ../harness/scripts/bonsai-paired/runtime.init.gradle --no-daemon --max-workers=2)
      - name: Fixed full-metric block 0 (20 complete pairs)
        timeout-minutes: 40
        env:
          SHARD: ${{ matrix.shard }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find vectors/vectors-core/build/libs -maxdepth 1 -name 'vectors-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          python3 harness/scripts/qwen-precision/run.py --shard "$SHARD" --arch "$ARCH" --models models --candidate-core "${jars[0]}" --output "out/precision-$ARCH-$SHARD" --block 0
      - name: Retain checkpoint 0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precision-${{ matrix.arch }}-${{ matrix.shard }}-checkpoint-0
          path: |
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/*.json
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/*.stdout
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/*.stderr
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/STATUS
          if-no-files-found: warn
          retention-days: 30
      - name: Fixed full-metric block 1 (20 complete pairs)
        timeout-minutes: 40
        env:
          SHARD: ${{ matrix.shard }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find vectors/vectors-core/build/libs -maxdepth 1 -name 'vectors-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          python3 harness/scripts/qwen-precision/run.py --shard "$SHARD" --arch "$ARCH" --models models --candidate-core "${jars[0]}" --output "out/precision-$ARCH-$SHARD" --block 1
      - name: Retain checkpoint 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precision-${{ matrix.arch }}-${{ matrix.shard }}-checkpoint-1
          path: |
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/*.json
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/*.stdout
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/*.stderr
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/STATUS
          if-no-files-found: warn
          retention-days: 30
      - name: Fixed full-metric block 2 (20 complete pairs)
        timeout-minutes: 40
        env:
          SHARD: ${{ matrix.shard }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find vectors/vectors-core/build/libs -maxdepth 1 -name 'vectors-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          python3 harness/scripts/qwen-precision/run.py --shard "$SHARD" --arch "$ARCH" --models models --candidate-core "${jars[0]}" --output "out/precision-$ARCH-$SHARD" --block 2
      - name: Retain checkpoint 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precision-${{ matrix.arch }}-${{ matrix.shard }}-checkpoint-2
          path: |
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/*.json
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/*.stdout
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/*.stderr
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/STATUS
          if-no-files-found: warn
          retention-days: 30
      - name: Fixed full-metric block 3 (20 complete pairs)
        timeout-minutes: 40
        env:
          SHARD: ${{ matrix.shard }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find vectors/vectors-core/build/libs -maxdepth 1 -name 'vectors-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          python3 harness/scripts/qwen-precision/run.py --shard "$SHARD" --arch "$ARCH" --models models --candidate-core "${jars[0]}" --output "out/precision-$ARCH-$SHARD" --block 3
      - name: Retain checkpoint 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precision-${{ matrix.arch }}-${{ matrix.shard }}-checkpoint-3
          path: |
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/*.json
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/*.stdout
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/*.stderr
            out/precision-${{ matrix.arch }}-${{ matrix.shard }}/STATUS
          if-no-files-found: warn
          retention-days: 30
  analyze:
    if: always()
    needs: paired
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: precision-*-checkpoint-3
          path: evidence
      - name: Normalize final checkpoint names
        run: |
          for path in evidence/*-checkpoint-3; do mv "$path" "${path%-checkpoint-3}"; done
      - name: Enforce every unchanged numerical, quality and metric gate
        run: python3 scripts/qwen-precision/analyze.py evidence precision-summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: precision-summary
          path: precision-summary.json
          retention-days: 30
