name: Flat ARM activation recipe caller proof
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/sleef-activation-flat.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caller:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Verify immutable external runtime and protocol
        env:
          PAYLOAD_URL: ${{ secrets.SLEEF_ACTIVATION_FLAT_URL }}
        run: |
          set -euo pipefail
          mkdir -p proof-out
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo 'f0e6f1a7ef957d4f4b939ff4639c1a447c7c67ad96bc2ab334c258ebfe8173b0  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile
          with tarfile.open('payload.tar.gz') as t:t.extractall('.',filter='data')
          PYCODE
          lscpu > proof-out/host.txt
          java -XX:+PrintFlagsFinal -version >> proof-out/host.txt 2>&1
      - name: Actual public cold hot aliases tails history and concurrency
        run: python3 payload/run.py parity
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sleef-flat-parity-arm
          path: |
            proof-out
            payload/PROTOCOL.md
            payload/files.json
            payload/freeze.json
          retention-days: 30
      - name: Retain unchanged existing public activation assertions
        continue-on-error: true
        run: python3 payload/run.py existing
      - name: Four fixed matched fresh-process public caller blocks
        run: python3 payload/run.py timing
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sleef-flat-caller-arm
          path: |
            proof-out
            payload/PROTOCOL.md
            payload/files.json
            payload/freeze.json
          retention-days: 30
      - name: Report existing assertion failures without hiding them
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json,pathlib
          p=pathlib.Path('proof-out/executions-existing.json')
          assert p.exists(), 'existing test execution incomplete'
          rows=json.loads(p.read_text())
          assert all(r['exitCode']==0 for r in rows), 'unchanged existing activation assertions failed; diagnostic measurements do not permit promotion'
          PYCODE
