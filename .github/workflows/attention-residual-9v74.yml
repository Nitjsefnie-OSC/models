name: Hardware-admitted Q51 attention allocation attribution
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/attention-residual-9v74.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        attempt: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Admit fixed CPU model before any model execution
        id: admission
        env:
          ATTEMPT: ${{ matrix.attempt }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          lscpu > evidence/host.txt
          java -XX:ActiveProcessorCount=4 -XX:+PrintFlagsFinal -version >> evidence/host.txt 2>&1
          cat > PreferredVector.java <<'JAVA'
          import jdk.incubator.vector.FloatVector;
          class PreferredVector {
            public static void main(String[] args) {
              System.out.println(FloatVector.SPECIES_PREFERRED.vectorBitSize());
            }
          }
          JAVA
          java --add-modules jdk.incubator.vector -XX:ActiveProcessorCount=4 PreferredVector.java > evidence/preferred-vector-bits.txt
          python3 - <<'PYCODE'
          import json,os,subprocess
          from pathlib import Path
          cpu=subprocess.check_output(['lscpu','-J'],text=True)
          rows=json.loads(cpu)['lscpu']
          model=next(x['data'] for x in rows if x['field']=='Model name:')
          accepted='AMD EPYC 9V74' in model
          version=subprocess.check_output(['java','-version'],stderr=subprocess.STDOUT,text=True)
          assert '25.0.3+9' in version
          result={'attempt':int(os.environ['ATTEMPT']),'model':model,'accepted':accepted,'status':'ADMITTED' if accepted else 'NOT_APPLICABLE','preferredFloatBits':int(Path('evidence/preferred-vector-bits.txt').read_text()),'java':version,'selection':'CPU identity before model execution; no timing or allocation selection; no replacement attempts'}
          Path('evidence/admission.json').write_text(json.dumps(result,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('accepted='+str(accepted).lower()+'\n')
          print(json.dumps(result))
          PYCODE
      - name: Verify unchanged immutable runtime and pinned weights
        if: steps.admission.outputs.accepted == 'true'
        env:
          PAYLOAD_URL: ${{ secrets.ATTENTION_RESIDUAL_9V74_URL }}
          MODEL_URL: ${{ secrets.ATTENTION_RESIDUAL_MODEL_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '99fa0b1e1beeaaa1333a590f9f7e5508d9486d6e41fd260d229fef82d857f548  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile
          with tarfile.open('payload.tar.gz') as t:t.extractall('.',filter='data')
          PYCODE
          python3 payload/run.py prepare
      - name: Original plain actual-model request stream
        if: steps.admission.outputs.accepted == 'true'
        run: python3 payload/run.py plain-before
      - name: Same request stream with allocation stacks and compiler inlining log
        if: steps.admission.outputs.accepted == 'true'
        run: python3 payload/run.py jfr
      - name: Independent plain process after observer
        if: steps.admission.outputs.accepted == 'true'
        run: python3 payload/run.py plain-after
      - name: Decode retained full-depth allocation and execution stacks
        if: always()
        run: |
          if test -f evidence/allocation.jfr; then
            jfr print --json --stack-depth 128 --events jdk.ObjectAllocationSample,jdk.ExecutionSample evidence/allocation.jfr > evidence/allocation-events.json
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-attention-9v74-attempt-${{ matrix.attempt }}
          path: |
            evidence/*.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*.jfr
            evidence/*.xml
            evidence/*.txt
            payload/protocol.json
            payload/files.json
          retention-days: 30
