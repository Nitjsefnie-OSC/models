name: ARM segment-copy v5 SwiGLU fixed performance
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/arm-segment-copy-v5-performance.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: {host: [0, 1]}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25.0.3'}
      - name: Extract immutable candidate and protocol
        env: {PAYLOAD_URL: '${{ secrets.ARM_PRIMITIVE_SLEEF_URL }}'}
        run: |
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo 'ecdb577c4d6fa1f11f01ac9793b34446b0289bb3ee2bfeb5b1f1fd945a664d66  payload.tar.gz' | sha256sum -c -
          python3 -c "import tarfile; tarfile.open('payload.tar.gz').extractall('.', filter='data')"
      - name: Actual N2 admission and exact contracts before timing
        run: python3 payload/worker.py prepare ${{ matrix.host }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: segment-v5-host-${{ matrix.host }}-preflight
          path: |
            out/
            payload/protocol.json
            payload/files.json
          retention-days: 30
      - name: Separate gates and convolution initialization observations
        run: python3 payload/worker.py initialization ${{ matrix.host }}
      - name: Fixed twelve triplets or predeclared early rejection
        run: python3 payload/worker.py measure ${{ matrix.host }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: segment-v5-host-${{ matrix.host }}
          path: |
            out/
            payload/protocol.json
            payload/files.json
          retention-days: 30
  analyze:
    needs: component
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: segment-v5-host-*
          path: raw
      - name: Extract exact analyzer and require both admitted hosts
        env: {PAYLOAD_URL: '${{ secrets.ARM_PRIMITIVE_SLEEF_URL }}'}
        run: |
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo 'ecdb577c4d6fa1f11f01ac9793b34446b0289bb3ee2bfeb5b1f1fd945a664d66  payload.tar.gz' | sha256sum -c -
          python3 -c "import tarfile; tarfile.open('payload.tar.gz').extractall('.', filter='data')"
          python3 - <<'PY'
          from pathlib import Path
          for host in range(2):
              p=Path('raw')/f'segment-v5-host-{host}'
              assert p.is_dir(),p
              p.rename(Path('raw')/f'host-{host}')
          PY
      - name: Preserve failures and fixed hierarchical intervals
        run: |
          python3 payload/analyze-initialization.py raw initialization.json
          python3 payload/analyze.py raw analysis.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: segment-v5-analysis
          path: |
            analysis.json
            initialization.json
          retention-days: 30
