name: Q51 isolated ARM allocation and compiler diagnosis
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: ['.github/workflows/q51-scratch-jfr.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Prepare exact controls
        env:
          Q51_SCRATCH_REFERENCE_URL: ${{ secrets.Q51_SCRATCH_REFERENCE_URL }}
        run: python3 scripts/q51-scratch/run.py prepare --out "$RUNNER_TEMP/q51" --models .
      - name: Capture bounded prior compiler and allocation window
        run: python3 scripts/q51-scratch/run.py diagnostic-window --diagnostic-variant prior --out "$RUNNER_TEMP/q51"
      - name: Retain prior diagnostic immediately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q51-arm-window-prior
          path: |
            ${{ runner.temp }}/q51/provenance.json
            ${{ runner.temp }}/q51/window-prior.*
          retention-days: 30
      - name: Capture bounded row-reuse compiler and allocation window
        run: python3 scripts/q51-scratch/run.py diagnostic-window --diagnostic-variant row-reuse --out "$RUNNER_TEMP/q51"
      - name: Retain row-reuse diagnostic immediately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q51-arm-window-row-reuse
          path: |
            ${{ runner.temp }}/q51/provenance.json
            ${{ runner.temp }}/q51/window-row-reuse.*
          retention-days: 30
      - name: Capture bounded full compiler and allocation window
        run: python3 scripts/q51-scratch/run.py diagnostic-window --diagnostic-variant full --out "$RUNNER_TEMP/q51"
      - name: Retain full diagnostic immediately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q51-arm-window-full
          path: |
            ${{ runner.temp }}/q51/provenance.json
            ${{ runner.temp }}/q51/window-full.*
          retention-days: 30
