name: SwiGLU hybrid allocation screen
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/swiglu-hybrid-screen.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Fetch immutable external diagnostic
        env:
          PAYLOAD_URL: ${{ secrets.SWIGLU_HYBRID_SCREEN_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo "842d78a62148e7b9fc81657bc81357bb1b233d6ab438be29fbd3931902c892e4  payload.tar.gz" | sha256sum -c -
          tar -xzf payload.tar.gz
      - name: Verify actual artifacts and source correspondence
        run: python3 payload/run.py prepare
      - name: Finite bits and special-value alias parity
        run: python3 payload/run.py parity
      - name: Four fixed three-arm pairs per shape
        run: python3 payload/run.py timing
      - name: Analyze all retained observations
        if: always()
        run: python3 payload/run.py analyze
      - name: Retain raw receipts including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiglu-hybrid-${{ matrix.runner }}
          path: evidence/
          retention-days: 30
