name: Prepared native functional validation
run-name: Prepared native validation (f3b32fbb + coverage tests)
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/prepared-native-validation.yml]
  workflow_dispatch:
    inputs:
      targets:
        description: Supported platforms to validate
        type: choice
        options: [all, windows]
        default: all
        required: true
permissions:
  contents: read
jobs:
  native:
    name: Composed native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets == 'windows' && '[{"runner":"windows-2025","platform":"windows-x86_64","distribution":"temurin"},{"runner":"windows-11-arm","platform":"windows-aarch64","distribution":"zulu"}]' || '[{"runner":"ubuntu-24.04","platform":"linux-x86_64","distribution":"temurin"},{"runner":"ubuntu-24.04-arm","platform":"linux-aarch64","distribution":"temurin"},{"runner":"macos-15-intel","platform":"macos-x86_64","distribution":"temurin"},{"runner":"macos-15","platform":"macos-aarch64","distribution":"temurin"},{"runner":"windows-2025","platform":"windows-x86_64","distribution":"temurin"},{"runner":"windows-11-arm","platform":"windows-aarch64","distribution":"zulu"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve exact source bytes and allow long paths
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
      - uses: actions/checkout@v5
        with:
          ref: 218daaea7b3a52e97311b56e5d950245ed917343
          path: models
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: ${{ matrix.platform == 'windows-aarch64' }}
      - name: Install the declared Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.96.0 clippy rustfmt
      - name: Fetch and verify immutable source and validation harness
        env:
          PAYLOAD_URL: ${{ secrets.PREPARED_NATIVE_VALIDATION_PAYLOAD_URL }}
        run: |
          python - <<'PYCODE'
          import hashlib, os, pathlib, tarfile, urllib.request
          path = pathlib.Path('payload.tar.gz')
          urllib.request.urlretrieve(os.environ['PAYLOAD_URL'], path)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '8c690323d976ae32b054e37b9f08e0e135823235284374cdb01fdeb4a45e6186'
          pathlib.Path('harness').mkdir()
          with tarfile.open(path) as archive:
              archive.extractall('harness', filter='data')
          PYCODE
      - name: Verify source and prepare the frozen upstream artifact
        run: python harness/validate-native.py prepare
      - name: Run all native checks and require zero skipped tests
        run: python harness/validate-native.py test '${{ matrix.platform }}'
      - name: Retain every result and actual native artifact identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prepared-native-${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            native-validation/
            models/backend-native/build/test-results/test/
            models/backend-native/build/reports/composed-core.json
            models/backend-native/build/reports/tests/test/
            models/backend-native/build/reports/spotbugs/
            models/backend-native/build/libs/
            models/backend-native/build/native-artifacts/
