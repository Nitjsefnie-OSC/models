      - name: Separate untimed allocation and compilation diagnosis
        run: python3 scripts/q51-scratch/run.py diagnostic --out "$RUNNER_TEMP/q51"
      - name: Retain untimed diagnostic records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q51-${{ matrix.runner }}-diagnostic
          path: |
            ${{ runner.temp }}/q51/diagnostic-*
      - name: Analyze every declared triplet
        run: python3 scripts/q51-scratch/analyze.py "$RUNNER_TEMP/q51" "$RUNNER_TEMP/q51/summary.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q51-${{ matrix.runner }}-summary
          path: ${{ runner.temp }}/q51/summary.json
