          name: q51-${{ matrix.runner }}-triplet-1
          path: |
            ${{ runner.temp }}/q51/timing-1-*.stdout
            ${{ runner.temp }}/q51/timing-1-*.stderr
            ${{ runner.temp }}/q51/timing-1-*.json
