name: Q51 scratch code-form diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Prepare exact historical controls and commonly rebuilt variants
        env:
          Q51_SCRATCH_REFERENCE_URL: ${{ secrets.Q51_SCRATCH_REFERENCE_URL }}
        run: python3 scripts/q51-scratch/run.py prepare --out "$RUNNER_TEMP/q51" --models .
      - name: Retain provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q51-${{ matrix.runner }}-prepared
          path: |
            ${{ runner.temp }}/q51/*.json
            ${{ runner.temp }}/q51/*.stdout
            ${{ runner.temp }}/q51/*.stderr
      - name: Verify148 cases and observed routes
        run: python3 scripts/q51-scratch/run.py correctness --out "$RUNNER_TEMP/q51"
      - name: Retain correctness
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q51-${{ matrix.runner }}-correctness
          path: |
            ${{ runner.temp }}/q51/*.json
            ${{ runner.temp }}/q51/*.stdout
            ${{ runner.temp }}/q51/*.stderr
            ${{ runner.temp }}/q51/CORRECT
      - name: Matched triplet 0
        run: python3 scripts/q51-scratch/run.py timing --pair 0 --out "$RUNNER_TEMP/q51"
      - name: Retain triplet 0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q51-${{ matrix.runner }}-triplet-0
          path: |
            ${{ runner.temp }}/q51/timing-0-*.stdout
            ${{ runner.temp }}/q51/timing-0-*.stderr
            ${{ runner.temp }}/q51/timing-0-*.json
            ${{ runner.temp }}/q51/triplet-0.complete.json
      - name: Matched triplet 1
        run: python3 scripts/q51-scratch/run.py timing --pair 1 --out "$RUNNER_TEMP/q51"
      - name: Retain triplet 1
        if: always()
        uses: actions/upload-artifact@v7
