name: GDN convolution accumulation and activation trace
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/gdn-convolution-split.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Fetch immutable diagnostic
        env:
          PAYLOAD_URL: ${{ secrets.GDN_CONVOLUTION_SPLIT_URL }}
        run: |
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo "8cec10ef191e0b81e8a99cc2451e16372e15a3f37ce10eec5b07dda7a8b778d6  payload.tar.gz" | sha256sum -c -
          tar -xzf payload.tar.gz
      - name: Verify actual artifacts and build unchanged native arms
        run: python3 payload/run.py prepare
      - name: model-only
        run: python3 payload/run.py model-only
      - name: Retain model-only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-convolution-split-${{ matrix.runner }}-model-only
          path: evidence/
          retention-days: 30
      - name: combined
        run: python3 payload/run.py combined
      - name: Retain completed combined observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-convolution-split-${{ matrix.runner }}-combined
          path: evidence/
          retention-days: 30
      - name: capture
        run: python3 payload/run.py capture
      - name: Retain completed capture observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-convolution-split-${{ matrix.runner }}-capture
          path: evidence/
          retention-days: 30
