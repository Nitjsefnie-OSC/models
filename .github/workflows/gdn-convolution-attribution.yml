name: GDN convolution numeric attribution
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/gdn-convolution-attribution.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Fetch immutable diagnostic
        env:
          PAYLOAD_URL: ${{ secrets.GDN_CONVOLUTION_ATTRIBUTION_URL }}
        run: |
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo "cc16c05478bf0a22959703df6604a2054069d6c2ba333e2574455abe7c0cdeb3  payload.tar.gz" | sha256sum -c -
          tar -xzf payload.tar.gz
      - name: Verify actual artifacts and build unchanged native arms
        run: python3 payload/run.py prepare
      - name: combined
        run: python3 payload/run.py combined
      - name: Retain completed combined observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-convolution-${{ matrix.runner }}-combined
          path: evidence/
          retention-days: 30
      - name: strict-convolution
        run: python3 payload/run.py strict-convolution
      - name: Retain completed strict-convolution observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-convolution-${{ matrix.runner }}-strict-convolution
          path: evidence/
          retention-days: 30
      - name: capture
        run: python3 payload/run.py capture
      - name: Retain completed capture observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdn-convolution-${{ matrix.runner }}-capture
          path: evidence/
          retention-days: 30
