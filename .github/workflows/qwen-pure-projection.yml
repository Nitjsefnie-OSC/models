name: Actual Qwen pure-Java projection diagnosis
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/qwen-pure-projection.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, arm]
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness
          ref: 37582fcf48b9262a260dc3d55051d0dec992f475
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Fetch immutable diagnostic and held runtime
        env:
          PAYLOAD_URL: ${{ secrets.QWEN_PURE_PROJECTION_URL }}
          COMPOSED_URL: ${{ secrets.GDN_COMPOSED_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo "ee0e9f3250a38d127fbdbd1d9d3798d675232d02e1bd5d219e6d5e23e33c21c9  payload.tar.gz" | sha256sum -c -
          tar -xzf payload.tar.gz
          curl --fail --silent --show-error --location "$COMPOSED_URL" -o composed.tar.gz
          python3 - <<'PYCODE'
          import hashlib,json,tarfile
          p=json.load(open('harness/scripts/gdn-sharded/protocol.json'))
          assert hashlib.sha256(open('composed.tar.gz','rb').read()).hexdigest()==p['runtimePayloadSha256']
          with tarfile.open('composed.tar.gz') as t:t.extractall('.',filter='data')
          PYCODE
      - name: Verify actual Linux artifact inventory
        env:
          GDN_REFERENCE_URL: ${{ secrets.GDN_REFERENCE_URL }}
        run: python3 payload/run.py prepare --arch ${{ matrix.arch }}
      - name: Fixed projection process triplet 0
        run: python3 payload/run.py pair --pair 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-pure-projection-${{ matrix.arch }}-pair-0
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
            out/*.progress.jsonl
            out/*-snapshots/*
      - name: Fixed projection process triplet 1
        run: python3 payload/run.py pair --pair 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-pure-projection-${{ matrix.arch }}-pair-1
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
            out/*.progress.jsonl
            out/*-snapshots/*
      - name: Analyze within and between process stability
        run: python3 payload/run.py analyze
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen-pure-projection-${{ matrix.arch }}-summary
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
            out/*.progress.jsonl
            out/*-snapshots/*
