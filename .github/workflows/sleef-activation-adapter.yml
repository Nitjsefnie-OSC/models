name: Published ARM activation recipe caller proof
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/sleef-activation-adapter.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caller:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Verify immutable external runtime and protocol
        env:
          PAYLOAD_URL: ${{ secrets.SLEEF_ACTIVATION_ADAPTER_URL }}
        run: |
          set -euo pipefail
          mkdir -p proof-out
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '75b171d9cb0735a401f5877f74220ac54098bf30c2662656212b3227bcf046b6  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile
          with tarfile.open('payload.tar.gz') as t:t.extractall('.',filter='data')
          PYCODE
          lscpu > proof-out/host.txt
          java -XX:+PrintFlagsFinal -version >> proof-out/host.txt 2>&1
      - name: Actual public cold hot aliases tails history and concurrency
        run: python3 payload/run.py parity
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sleef-adapter-parity-arm
          path: |
            proof-out
            payload/PROTOCOL.md
            payload/files.json
            payload/freeze-manifest.json
          retention-days: 30
      - name: Four fixed matched fresh-process public caller blocks
        run: python3 payload/run.py timing
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sleef-adapter-caller-arm
          path: |
            proof-out
            payload/PROTOCOL.md
            payload/files.json
            payload/freeze-manifest.json
          retention-days: 30
