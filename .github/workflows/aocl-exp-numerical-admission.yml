name: External AMD exp numerical admission
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/aocl-exp-numerical-admission.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Verify and extract immutable permissive upstream proof
        env:
          PAYLOAD_URL: ${{ secrets.AOCL_EXP_NUMERICAL_ADMISSION_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo 'c9d38e023c00de4589b860c55b1ca996462ceb5439869587f9ba2cab6931d032  payload.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import tarfile
          with tarfile.open('payload.tar.gz') as t:t.extractall('.',filter='data')
          PYCODE
          python3 payload/run.py --verify-only
      - name: Execute fixed upstream assembly and actual warmed JDK comparison
        run: python3 payload/run.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aocl-exp-numerical-admission
          path: |
            results/
            payload/
          if-no-files-found: error
