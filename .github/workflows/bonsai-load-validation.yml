    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: load-*-checkpoint-9
          path: evidence
      - name: Normalize final checkpoint names
        run: |
          for path in evidence/*-checkpoint-9; do mv "$path" "${path%-checkpoint-9}"; done
      - name: Enforce unchanged startup and precision limits
        run: python3 scripts/bonsai-load/analyze.py evidence load-summary.json qwen-bf16
      - uses: actions/upload-artifact@v7
