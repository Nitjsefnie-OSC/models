name: ARM unchanged SwiGLU CPU-PC attribution
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: [.github/workflows/arm-swiglu-pc-attribution.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25.0.3'}
      - name: Extract immutable diagnostic
        env: {PAYLOAD_URL: '${{ secrets.ARM_RANGE_ADMISSION_URL }}'}
        run: |
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo '3c6c03d461c4cbdc920dfb8917b2769e779204c6d20eb45ddd5e536bbbc76723  payload.tar.gz' | sha256sum -c -
          python3 -c "import tarfile; tarfile.open('payload.tar.gz').extractall('.', filter='data')"
      - name: Install standard perf once
        run: |
          mkdir -p out
          sudo -n apt-get update 2>&1 | tee out/tool-install.stdout
          sudo -n apt-get install -y linux-tools-generic 2>&1 | tee -a out/tool-install.stdout
          python3 - <<'PY'
          from pathlib import Path
          import os
          choices=sorted(Path('/usr/lib/linux-tools').glob('*/perf'))
          assert choices, 'No packaged perf executable; no substitute/retry'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PERF_BINARY='+str(choices[-1])+'\n')
          PY
      - name: One actual permission preflight then fixed diagnostic
        run: python3 payload/worker.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm-swiglu-pc-attribution
          path: |
            out/
            payload/protocol.json
            payload/files.json
          retention-days: 30
