name: Q51 cold allocation attribution
on:
  push:
    branches: [fix/qwen-precision-proof]
    paths: ['.github/workflows/q51-cold-attribution.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, arm]
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness
      - name: Read immutable protocol
        id: protocol
        run: |
          python3 - <<'PY'
          import json, os
          p=json.load(open('harness/scripts/q51-route/protocol.json'))
          assert p['dispatchReady'], 'final source/artifact freeze is still held'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('models='+p['modelsRevision']+'\n')
              f.write('vectors='+p['vectorsRevision']+'\n')
          PY
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.protocol.outputs.models }}
          path: models
      - uses: actions/checkout@v5
        with:
          repository: integrallis/vectors
          ref: ${{ steps.protocol.outputs.vectors }}
          path: vectors
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Build immutable actual artifacts
        run: |
          set -euo pipefail
          test "$(git -C models rev-parse HEAD)" = '${{ steps.protocol.outputs.models }}'
          test "$(git -C vectors rev-parse HEAD)" = '${{ steps.protocol.outputs.vectors }}'
          (cd vectors && ./gradlew :vectors-core:jar --no-daemon --max-workers=2)
          (cd models && ./gradlew :backend-native:cargoBuildRelease :backend-native:copyPairedRuntime --init-script ../harness/scripts/q51-route/runtime.init.gradle --no-daemon --max-workers=2)
      - name: prepare
        env:
          Q51_SCRATCH_REFERENCE_URL: ${{ secrets.Q51_SCRATCH_REFERENCE_URL }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find vectors/vectors-core/build/libs -maxdepth 1 -name 'vectors-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          python3 harness/scripts/q51-route/run.py prepare --arch "$ARCH" --models models --core "${jars[0]}" --out out
      - name: Retain prepare
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q51-route-${{ matrix.arch }}-prepare
          path: |
            out/*.json
            out/*.stdout
            out/*.stderr
      - name: hybrid plain cold capture
        run: python3 harness/scripts/q51-route/diagnose_cold.py --out out --arm hybrid
      - name: Retain hybrid plain immediately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q51-cold-${{ matrix.arch }}-hybrid-plain
          path: |
            out/cold-hybrid-plain.*
            out/cold-hybrid-plain-*.json
            out/cold-tasks.json
            out/cold-signature.json
      - name: hybrid jfr cold capture
        run: python3 harness/scripts/q51-route/diagnose_cold.py --out out --arm hybrid --profile
      - name: Retain hybrid jfr immediately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q51-cold-${{ matrix.arch }}-hybrid-jfr
          path: |
            out/cold-hybrid-jfr.*
            out/cold-hybrid-jfr-*.json
            out/cold-tasks.json
            out/cold-signature.json
      - name: native plain cold capture
        run: python3 harness/scripts/q51-route/diagnose_cold.py --out out --arm native
      - name: Retain native plain immediately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q51-cold-${{ matrix.arch }}-native-plain
          path: |
            out/cold-native-plain.*
            out/cold-native-plain-*.json
            out/cold-tasks.json
            out/cold-signature.json
      - name: native jfr cold capture
        run: python3 harness/scripts/q51-route/diagnose_cold.py --out out --arm native --profile
      - name: Retain native jfr immediately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q51-cold-${{ matrix.arch }}-native-jfr
          path: |
            out/cold-native-jfr.*
            out/cold-native-jfr-*.json
            out/cold-tasks.json
            out/cold-signature.json
